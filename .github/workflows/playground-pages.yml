name: Publish playground

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playground-pages.yml'
      - 'playground/**'
      - 'src/jbcc/**'
      - 'tests/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install playground dependencies
        working-directory: playground
        run: bun install --frozen-lockfile
      - name: Check the static playground
        run: |
          bun playground/build-static.mjs
          python3 -m http.server 18766 --bind 127.0.0.1 --directory dist/playground &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry-all-errors --retry 4 --retry-delay 1 http://127.0.0.1:18766/ -o /dev/null
          cd playground
          bunx playwright install --with-deps chromium
          bunx playwright test
      - name: Build the site for release
        env:
          JBCC_ANALYTICS_FRAME: https://jbc-lang.github.io/playground-metrics/
        run: bun playground/build-static.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/playground

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
