name: Publish jbcc

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Verify the release tag
        id: release
        run: |
          version=$(uv version --short)
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and check distributions
        run: |
          uv build --no-sources --python 3.12
          uvx twine check --strict dist/*.tar.gz dist/*.whl
      - name: Run the wheel outside the checkout
        run: |
          wheel=$(realpath dist/*.whl)
          work=$(mktemp -d)
          cp tests/programs/hello.b "$work/"
          cd "$work"
          printf 'Hello, jBC!\n' > expected.stdout
          uvx --no-cache --from "$wheel" jbcc --run hello.b > actual.stdout
          diff -u expected.stdout actual.stdout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/jbcc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Run the TestPyPI release outside the checkout
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          work=$(mktemp -d)
          cp tests/programs/hello.b "$work/"
          cd "$work"
          printf 'Hello, jBC!\n' > expected.stdout
          for attempt in $(seq 1 12); do
            if uvx --no-cache --default-index https://test.pypi.org/simple/ \
                "jbcc@$VERSION" --run hello.b > actual.stdout; then
              diff -u expected.stdout actual.stdout
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Check TestPyPI release metadata
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from urllib.request import urlopen

          version = os.environ["VERSION"]
          with urlopen(f"https://test.pypi.org/pypi/jbcc/{version}/json", timeout=15) as response:
              metadata = json.load(response)["info"]
          assert metadata["version"] == version
          assert metadata["license_expression"] == "MIT AND Unicode-3.0"
          assert metadata["project_urls"]["Homepage"] == "https://github.com/jbc-lang/jbcc"
          description = metadata["description"]
          for link in ("LICENSE", "THIRD-PARTY-NOTICES.md"):
              assert f"https://github.com/jbc-lang/jbcc/blob/main/{link}" in description
          PYTHON

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jbcc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
